name: Weekly AI trends digest

# 毎週日曜 08:30/09:30/10:30 JST (前日23:30 UTC / 00:30 UTC / 01:30 UTC) に、
# 前の日曜〜土曜7日分のAIトレンド日次記事から週刊まとめ記事を生成→出典検証→ビルド→公開する。
# 対象は AI トレンド版（posts）のみ（介護版は対象外。詳細: docs/adr/adr-2026-09-14-weekly-digest.md）。
# 出典検証（validate-citations.mjs --type=weekly）に失敗した場合は commit も deploy も行わない
# （日次版と同じ設計思想: 収集していない情報を含む記事を公開しない）。
#
# 2026-09-27追記: 従来は11:07 JST単発だったが、「11時を過ぎると遅すぎる」という運用要件を
# 受けて11時より前の3時刻・複数cronに変更した（daily.ymlの複数cron緩和策と同じ考え方。
# 詳細: docs/adr/adr-2026-09-14-schedule-reliability.md）。adr-2026-09-14-schedule-reliability.md
# では「retryが翌日にずれるとweeklyWindow()のweekStart計算の前提（週は日曜始まり）が壊れる」
# ことを理由に週次への複数cron適用を見送っていたが、今回の3時刻はいずれも同じ日曜午前中
# （08:30〜10:30 JST）に収まるよう間隔を詰めており、`Skip if already generated`のJST日付判定が
# 全リトライで同じ日曜日付になるため当時の懸念は生じない。
#
# daily.yml（毎日03:07/前日21:07 UTC。2026-09-28に中間枠を廃止し2回へ縮小。詳細:
# daily.yml内コメント）とcron時刻を意図的にずらしている理由
# （初期案は同時刻だった）: もし同時刻に発火すると、daily.ymlの完了を待つ間に両ワークフローの
# github.shaがイベント発生時点で固定され、concurrencyグループで後から実行される側が
# 古いSHAのままpushしてnon-fast-forwardで失敗する事態が起こりうる（初期設計時は
# daily.ymlにcare-rebuild.ymlの「Sync to latest main」に相当する対策が無かった。
# 現在はdaily.ymlにも同期ステップを追加済みだが、時刻をずらすこと自体も引き続き有効な
# 一次防御として維持している。詳細: docs/adr/adr-2026-09-14-weekly-digest.md）。
on:
  schedule:
    - cron: '30 23 * * 6' # JST日曜08:30
    - cron: '30 0 * * 0'  # JST日曜09:30
    - cron: '30 1 * * 0'  # JST日曜10:30
  workflow_dispatch:
    inputs:
      date:
        description: '公開日 (YYYY-MM-DD)。対象期間はこの前日から遡って7日間。省略時は当日（JST）'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # Workload Identity Federation（Vertex AI 呼び出し、API キー不使用）
  pages: write

concurrency:
  group: daily-digest
  cancel-in-progress: false
  # 2026-09-27追記: GitHub Actionsが2026-05-07に追加した`queue: max`（最大100件の
  # pending runをキャンセルせず順序通りに逐次処理する設定、公式ドキュメントで確認済み。
  # デフォルトの`queue: single`は同一グループのpending runを1件しか許可せず、新しいrunが
  # キューイングされると既存のpending runがキャンセルされる）を指定し、間隔の詰まった
  # weekly.ymlの3cronがdaily.ymlの09:07 JSTリカバリrunを退避させるリスク
  # （docs/adr/adr-2026-09-14-schedule-reliability.mdで「許容する残存リスク」として
  # 記録していたもの）を解消する。`cancel-in-progress: true`との併用は仕様上禁止だが、
  # 本ワークフローは元々falseのため問題ない。daily.yml・care-rebuild.ymlにも同じ設定を
  # 追加し、同一グループを共有する3ワークフロー全体で整合させている。
  queue: max

jobs:
  generate:
    runs-on: ubuntu-latest
    # daily.ymlと同じconcurrencyグループを共有するため、万一ハングすると翌朝のdaily.ymlの
    # 実行までブロックしてしまう。デフォルトの6時間タイムアウトでは長すぎるため明示的に短くする。
    timeout-minutes: 25
    permissions:
      contents: write # 週刊記事のコミットに必要
      id-token: write
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync to latest main
        # daily-digest concurrency グループで daily.yml / care-rebuild.yml の完了待ちになっている間に
        # それらがコミット・push すると、待機解除後にこのジョブが古い SHA のままビルド・コミットして
        # しまい、後続の git push が non-fast-forward で失敗する。
        # `git fetch origin main` は remote.origin.fetch の設定次第で refs/remotes/origin/main を
        # 更新しない場合があるため（codex reviewで指摘）、fetch操作で常に更新される FETCH_HEAD に
        # 対してresetする（daily.ymlの同期ステップと同じ対策。詳細: docs/adr/adr-2026-09-14-weekly-digest.md）。
        run: |
          git fetch origin main
          git reset --hard FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Resolve publish date
        id: resolve_date
        run: |
          if [ -n "$PUBLISH_DATE" ]; then
            echo "date=$PUBLISH_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          fi
        env:
          PUBLISH_DATE: ${{ inputs.date }}

      - name: Skip if already generated
        # 1日3回（08:30/09:30/10:30 JST）のうち、先行のscheduleが遅延・ドロップせず既に
        # 成功していれば、後続の発火では生成・出典検証を二重実行しない（LLM呼び出しの
        # 無駄な二重発生・記事の意図しない再生成を防ぐ。daily.ymlの`Skip if already
        # generated`と同じ設計）。weekStartはcurate-weekly.mjsのweeklyWindow()と同じ
        # 「publishDateの7日前」の規則で計算する。このガードはevent_name == 'schedule'
        # （保険の2回目以降）にのみ適用し、workflow_dispatch（手動実行）では既存記事が
        # あっても常にフル実行する（既存記事の作り直し・障害復旧のための手動再実行という
        # 既存の運用を止めないため）。
        id: check_existing
        if: github.event_name == 'schedule'
        run: |
          WEEK_START=$(TZ=Asia/Tokyo date -d "$PUBLISH_DATE -7 days" +%F)
          if [ -f "site/src/content/weekly/${WEEK_START}.md" ]; then
            echo "週刊まとめ（${WEEK_START}〜）は生成済みのためスキップします。"
            echo "weekly_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "weekly_exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PUBLISH_DATE: ${{ steps.resolve_date.outputs.date }}

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        if: steps.check_existing.outputs.weekly_exists != 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/297750025000/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ai-notebot-ci@ai-notebot-yh.iam.gserviceaccount.com
          token_format: access_token

      - name: Curate weekly digest
        if: steps.check_existing.outputs.weekly_exists != 'true'
        run: node scripts/curate-weekly.mjs "$PUBLISH_DATE"
        env:
          PUBLISH_DATE: ${{ steps.resolve_date.outputs.date }}
          GEMINI_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_PROJECT: ai-notebot-yh

      - name: Validate citations (weekly, ハルシネーション遮断)
        if: steps.check_existing.outputs.weekly_exists != 'true'
        run: node scripts/validate-citations.mjs "$PUBLISH_DATE" --type=weekly
        env:
          PUBLISH_DATE: ${{ steps.resolve_date.outputs.date }}

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        id: build
        run: npm run build
        working-directory: site

      - name: Commit weekly digest
        run: |
          git config user.name "ai-notebot-bot"
          git config user.email "actions@github.com"
          git add site/src/content/weekly
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: weekly digest $PUBLISH_DATE"
            git push
          fi
        env:
          PUBLISH_DATE: ${{ steps.resolve_date.outputs.date }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
