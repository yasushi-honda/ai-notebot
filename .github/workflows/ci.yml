name: CI

# PR時の軽量チェック。LLM呼び出しは行わない（コスト・再現性のため）。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Run scripts unit tests
        run: node --test scripts/test/*.test.mjs

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Type check
        run: npm run check
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Check security articles are rendered as cards
        # rehype-security-sections が効かないと、ダークパネルやカードのない素の記事になる（例外も警告も出ない）。
        # ビルド成果物にセクションの包み（sec-theme）があることを確認する
        run: |
          shopt -s nullglob
          for f in dist/security/20*/index.html; do
            grep -q 'class="sec sec-theme"' "$f" || { echo "::error::$f にセクションの包み（sec-theme）がありません。rehype-security-sections が効いていない可能性があります"; exit 1; }
          done
        working-directory: site
