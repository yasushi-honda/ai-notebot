      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="420">ケアマネジャーが専門的な見地から</tspan><tspan x="72" y="444">内容を修正し、最終的なケアプラン</tspan><tspan x="72" y="468">を完成させます</tspan></text>
