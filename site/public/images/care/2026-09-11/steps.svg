        font-weight="700" fill="#ffffff">2</text>
      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="172">個人情報を完全に匿名化または抽象</tspan><tspan x="72" y="196">化した状態のテキストを用意します</tspan></text>
    </g><path d="M 40 224 L 40 242"
