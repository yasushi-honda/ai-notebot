      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="48">利用者や患者の氏名や識別番号など</tspan><tspan x="72" y="72">の個人情報をAIに入力しないルー</tspan><tspan x="72" y="96">ルを組織全体で決定します</tspan></text>
