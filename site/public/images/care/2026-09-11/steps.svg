<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 616" width="480" height="616">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0d9488" />
    </marker>
  </defs>
  <rect width="480" height="616" fill="#ffffff" stroke="#e2e8f0" />
    <g>
      <circle cx="40" cy="72" r="16" fill="#0d9488" />
      <text x="40" y="72" text-anchor="middle" dominant-baseline="central"
        font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="700" fill="#ffffff">1</text>
      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="48">利用者の氏名や個人情報を伏せた申</tspan><tspan x="72" y="72">し送りメモや音声の書き起こしを用</tspan><tspan x="72" y="96">意する</tspan></text>
    </g><path d="M 40 124 L 40 142"
              stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)" />
    <g>
      <circle cx="40" cy="184" r="16" fill="#0d9488" />
      <text x="40" y="184" text-anchor="middle" dominant-baseline="central"
        font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="700" fill="#ffffff">2</text>
      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="172">ChatGPTやClaudeなど</tspan><tspan x="72" y="196">の汎用生成AIにアクセスする</tspan></text>
    </g><path d="M 40 224 L 40 242"
              stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)" />
    <g>
      <circle cx="40" cy="296" r="16" fill="#0d9488" />
      <text x="40" y="296" text-anchor="middle" dominant-baseline="central"
        font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="700" fill="#ffffff">3</text>
      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="272">用意したメモを貼り付け、施設の記</tspan><tspan x="72" y="296">録フォーマットに沿った文章に整え</tspan><tspan x="72" y="320">るよう指示するプロンプトを入力…</tspan></text>
    </g><path d="M 40 348 L 40 366"
              stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)" />
    <g>
      <circle cx="40" cy="420" r="16" fill="#0d9488" />
      <text x="40" y="420" text-anchor="middle" dominant-baseline="central"
        font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="700" fill="#ffffff">4</text>
      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="396">生成された文章を確認し、事実関係</tspan><tspan x="72" y="420">に誤りがないかを担当者が必ず確定</tspan><tspan x="72" y="444">させる</tspan></text>
    </g><path d="M 40 472 L 40 490"
              stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)" />
    <g>
      <circle cx="40" cy="544" r="16" fill="#0d9488" />
      <text x="40" y="544" text-anchor="middle" dominant-baseline="central"
        font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="700" fill="#ffffff">5</text>
      <text font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16"
        font-weight="600" fill="#1e293b"><tspan x="72" y="520">必要に応じてご家族向けの連絡文や</tspan><tspan x="72" y="544">報告書の形式に言い換えて出力させ</tspan><tspan x="72" y="568">る</tspan></text>
    </g>
</svg>
