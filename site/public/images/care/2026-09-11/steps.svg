        font-weight="600" fill="#1e293b"><tspan x="72" y="396">AIが生成した文章の下書きを確認</tspan><tspan x="72" y="420">し、内容に誤りや不足がないかを人</tspan><tspan x="72" y="444">間が直接チェックします</tspan></text>
    </g><path d="M 40 472 L 40 490"
              stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)" />
